name: Update compatibility list

# Weekly rebuild of data/compatibility.json from MacPlay's curated list,
# AppleGamingWiki and AreWeAntiCheatYet. MacPlay downloads the result.
on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Rebuild the list
        run: python3 tools/update_compat.py

      - name: Commit it if it changed
        run: |
          if git diff --quiet -- data/compatibility.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/compatibility.json
          git commit -m "chore(data): refresh compatibility list"
          git push
